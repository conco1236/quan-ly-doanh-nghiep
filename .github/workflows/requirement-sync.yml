name: Sync requirement journal

on:
  issues:
    types: [opened, labeled]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync-owner-requirement:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.labels.*.name, 'requirement')
    runs-on: ubuntu-latest
    steps:
      - name: Create requirement journal pull request
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            if (issue.pull_request) return;

            const branch = `requirements/issue-${issue.number}`;
            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${branch}`,
            });
            if (existing.data.length > 0) return;

            const repository = await github.rest.repos.get({ owner, repo });
            const base = repository.data.default_branch;
            const baseRef = await github.rest.git.getRef({ owner, repo, ref: `heads/${base}` });
            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha: baseRef.data.object.sha,
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const journalPath = "docs/requirements.md";
            const journal = await github.rest.repos.getContent({ owner, repo, path: journalPath, ref: branch });
            if (Array.isArray(journal.data) || journal.data.type !== "file") {
              throw new Error("Không tìm thấy tệp nhật ký yêu cầu");
            }

            const clean = (value) => String(value || "Không có mô tả")
              .replace(/\r?\n+/g, " ")
              .replace(/\|/g, "\\|")
              .trim();
            const current = Buffer.from(journal.data.content, "base64").toString("utf8");
            const recordedAt = new Date().toISOString().replace("T", " ").replace(".000Z", "Z");
            const row = `| RQ-${issue.number} | ${recordedAt} | ${clean(issue.title)} | [#${issue.number}](${issue.html_url}) | Đã ghi nhận |\n`;

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: journalPath,
              message: `docs(requirements): ghi nhận yêu cầu #${issue.number}`,
              content: Buffer.from(`${current.trimEnd()}\n${row}`).toString("base64"),
              branch,
              sha: journal.data.sha,
            });

            const pullRequest = await github.rest.pulls.create({
              owner,
              repo,
              base,
              head: branch,
              title: `docs(requirements): đồng bộ yêu cầu #${issue.number}`,
              body: `Tự động đồng bộ issue #${issue.number} vào nhật ký yêu cầu. Pull request này chỉ cập nhật tài liệu và sẽ được merge sau khi CI bắt buộc đạt.`,
            });
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pullRequest.data.number,
              labels: ["requirements-sync"],
            });

            await github.graphql(
              `mutation($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {pullRequestId: $pullRequestId, mergeMethod: SQUASH}) {
                  pullRequest { number }
                }
              }`,
              { pullRequestId: pullRequest.data.node_id },
            );
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "ci.yml",
              ref: branch,
            });
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: `Đã tạo pull request #${pullRequest.data.number} để đồng bộ yêu cầu. Pull request sẽ tự động merge sau khi CI đạt.`,
            });
